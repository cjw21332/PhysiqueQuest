name: Backend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm run lint && npm test && npm run build && npm audit --audit-level=moderate
        working-directory: backend
      - run: npm run docs:export
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.json
      - name: Full history secret scan
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --log-opts=--all --redact=100 --no-banner
