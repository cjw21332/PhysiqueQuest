<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Reset your password</title>
</head>
<body style="margin:0;padding:0;background-color:#F7F8FA;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F7F8FA" style="width:100%;background-color:#F7F8FA;">
    <tr>
      <td align="center" style="padding:32px 12px;">
        <!--[if mso]><table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="width:100%;max-width:480px;background-color:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;border-spacing:0;">
          <tr>
            <td align="center" style="padding:32px 24px 24px;">
              <img src="https://res.cloudinary.com/hkf3rsym/image/upload/f_png,q_auto/physiquequest-icon" width="40" height="40" alt="PhysiqueQuest logo" style="display:block;width:40px;height:40px;border:0;">
              <p style="margin:10px 0 0;color:#111827;font-size:16px;line-height:24px;font-weight:600;">PhysiqueQuest</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px;">
              <h1 style="margin:0 0 24px;color:#111827;font-size:24px;line-height:32px;font-weight:700;text-align:center;">Reset your password</h1>
              <p style="margin:0 0 12px;color:#374151;font-size:15px;line-height:24px;font-weight:400;">Hi {{name}},</p>
              <p style="margin:0 0 24px;color:#374151;font-size:15px;line-height:24px;">Enter the code below in PhysiqueQuest to reset your password.</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border:1px solid #E5E7EB;border-radius:8px;">
                <tr>
                  <td align="center" style="padding:16px 8px;color:#16A34A;font-size:32px;line-height:44px;font-weight:700;letter-spacing:8px;white-space:nowrap;">{{passcode}}</td>
                </tr>
              </table>
              <p style="margin:16px 0 0;color:#6B7280;font-size:13px;line-height:21px;text-align:center;">This code expires in {{time}} and can be used once.</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:28px 24px 32px;">
              <p style="margin:0;color:#6B7280;font-size:12px;line-height:20px;">If you didn't request this, you can ignore this email.</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
