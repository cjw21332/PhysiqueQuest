# =============================================================================
# Optional TLS listener
# =============================================================================
# Enable by:
#   1. Placing the certificate chain and key at the paths below (see
#      docker/certs/README.md).
#   2. Uncommenting the include at the end of docker/nginx.conf.
#
# The HTTP listener on 8080 stays enabled either way, because a Render Web
# Service forwards plain HTTP to $PORT and would fail its health check if the
# only listener were TLS.
# =============================================================================

server {
    listen      8443 ssl;
    listen      [::]:8443 ssl;
    http2       on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Same allowlist as the plaintext listener. Copy docker/allowlist.conf here
    # too, or point this at the same file.
    include /etc/nginx/conf.d/allowlist.conf;

    location / {
        limit_conn connperip 20;
        limit_req  zone=perip burst=60 nodelay;

        proxy_pass         http://food_scanner;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Request-Id    $http_x_request_id;
        # Without this nginx sends its own address, so the allowlist above would
        # see 172.x instead of the real client.
        proxy_set_header   X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       off;
    }

    location = /livez {
        limit_req  off;
        proxy_pass http://food_scanner;
        access_log off;
    }
}
