# =============================================================================
# Source IP allowlist  --  THIS FILE IS THE NETWORK-LEVEL CONTROL
# =============================================================================
# Rules placed here are evaluated by nginx BEFORE a request reaches the Node
# service. The first matching rule wins, so order matters: `allow` lines must
# come first and `deny all` must come last.
#
# While this file contains no rules, nginx applies no restriction and the
# X-Internal-Api-Key check in the application is the only gate.
#
# >>> TODO: insert main backend outbound IPs here <<<
#
# How to find them: the main backend needs a fixed outbound address for this to
# work at all. On a static IP plan, use its egress IP (or the /32 of its
# private subnet). On a plan with dynamic egress, an IP allowlist cannot be
# used - see docs/DEPLOY.md for what to do instead.
#
# Example, single address:
#   allow 203.0.113.10;
#
# Example, several addresses and a private subnet:
#   allow 203.0.113.10;
#   allow 198.51.100.0/24;
#   allow 10.0.0.0/8;
#
# Example, Render's own egress ranges, so platform health checks still pass:
#   allow 0.0.0.0/0;   # NOT an allowlist - do not use this line
#
# Uncomment and edit one of the blocks below, then keep `deny all` last:
#
# allow 203.0.113.10;
# allow 198.51.100.0/24;
# deny all;
