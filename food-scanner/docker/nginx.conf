# =============================================================================
# nginx front end for the Food Scanner internal API
# =============================================================================
# Two jobs, and only two:
#   1. Terminate TLS.
#   2. Restrict who can reach the service at all, by source IP, BEFORE the
#      request reaches the Node process. This is the network-level control and
#      it is independent of the X-Internal-Api-Key header check in the app, so
#      a stolen token alone is not enough to reach the service from outside the
#      allowlist.
#
# The Node service itself publishes no ports. It is only reachable as
# `scanner:3001` on the private container network.
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured, greppable access log. The upstream service also emits its own
    # JSON access log; this one covers what nginx rejected, which never reaches
    # the application.
    log_format  json_combined escape=json
        '{'
        '"ts":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration_ms":$request_time,'
        '"request_id":"$http_x_request_id",'
        '"upstream_status":"$upstream_status"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Bound request bodies to the same limit the application enforces, so an
    # oversized upload is dropped here instead of being buffered by Node.
    client_max_body_size 8m;
    client_body_timeout  30s;
    client_header_timeout 15s;
    send_timeout        30s;

    # Rate limit per source IP. Coarse, and applied before the app-level
    # per-caller limit, so a flood never occupies Node workers.
    limit_req_zone  $binary_remote_addr zone=perip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=connperip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Resolve the scanner on the private container network. This name is only
    # resolvable inside the compose network, which is why the service publishes
    # no host port.
    upstream food_scanner {
        server scanner:3001;
        keepalive 16;
    }

    # ---------------------------------------------------------------------
    # HTTP listener - the default ingress.
    # ---------------------------------------------------------------------
    # This is the port a Render Web Service forwards to, so it MUST exist and
    # MUST serve plain HTTP on $PORT even when TLS is enabled below.
    server {
        listen      8080;
        listen      [::]:8080;
        server_name _;

        # See the note in docs/DEPLOY.md before changing this. On Render every
        # inbound connection arrives from Render's edge, not from the main
        # backend, so an allowlist keyed on the backend's own IP addresses will
        # reject Render's health checks and break the deploy.
        #
        # Populate docker/allowlist.conf to switch this on. While it is empty
        # this block is a no-op and the app-level X-Internal-Api-Key check is
        # the only gate.
        include /etc/nginx/conf.d/allowlist.conf;

        location / {
            limit_conn connperip 20;
            limit_req  zone=perip burst=60 nodelay;

            proxy_pass         http://food_scanner;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            # The application echoes this back in X-Request-Id and uses it for
            # end-to-end correlation with the caller's logs.
            proxy_set_header   X-Request-Id      $http_x_request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            proxy_buffering       off;
        }

        # Probes bypass the rate limiter so a busy service is not marked
        # unhealthy and restarted.
        location = /livez {
            limit_req  off;
            proxy_pass http://food_scanner;
            access_log off;
        }
        location = /readyz {
            limit_req  off;
            proxy_pass http://food_scanner;
            access_log off;
        }
    }

    # ---------------------------------------------------------------------
    # TLS listener
    # ---------------------------------------------------------------------
    # Opt in by uncommenting the include at the bottom of this file, after
    # dropping certificates into docker/certs/. Left out of the default build so
    # a missing certificate cannot stop the service from starting.
    #
    # include /etc/nginx/conf.d/tls.conf;
}
