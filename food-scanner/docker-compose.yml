# =============================================================================
# Local / single-VM parity stack
# =============================================================================
# Mirrors the production topology so the nginx allowlist, TLS listener and
# service token can be exercised before deploying.
#
#   main backend  ->  nginx (published)  ->  scanner:3001 (private network)
#
# The scanner container publishes NO port. It is reachable only from the
# compose network, so nothing on the host or the internet can address it
# directly - the allowlist and the service token are both still required.
# =============================================================================

services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: food-scanner:local
    restart: unless-stopped
    # No `ports:` block on purpose.
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN must be set - see .env.example}
      SERVICE_ID: ${SERVICE_ID:-main-backend}
      SERVICE_TOKENS_PREVIOUS: ${SERVICE_TOKENS_PREVIOUS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      USDA_API_KEY: ${USDA_API_KEY:?USDA_API_KEY must be set}
      # One hop: nginx. Raise only if you add another proxy in front.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-4194304}
      # Left unset by default: the service derives the body cap from the image
      # cap, so raising MAX_IMAGE_BYTES needs no second variable.
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-20000}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-10000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    expose:
      - "3001"
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      scanner:
        condition: service_healthy
    ports:
      # Bound to loopback. The main backend must be on this host to reach it.
      # For a different host, change to "0.0.0.0:8443:8080" AND rely on the
      # allowlist plus the host firewall - see docs/DEPLOY.md.
      - "127.0.0.1:8080:8080"
      # - "8443:8443"   # TLS listener, requires docker/certs + tls.conf enabled
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/allowlist.conf:/etc/nginx/conf.d/allowlist.conf:ro
      # - ./docker/tls.conf:/etc/nginx/conf.d/tls.conf:ro
      # - ./docker/certs:/etc/nginx/certs:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  internal:
    driver: bridge
