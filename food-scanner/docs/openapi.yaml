openapi: 3.1.0

info:
  title: Food Scanner Internal API
  version: "2.0.0"
  description: |
    Internal-only service that turns a food image into detected food items with
    scaled macronutrient estimates.

    **This API is not public.** It is reachable only from the main backend, over
    a private network path, and every `/v1` request must carry the shared secret
    in `X-Internal-Api-Key`. There is no browser-facing CORS policy and no user
    authentication: end users never reach this service directly.

    Image **URLs are not accepted.** A server-side fetch of a caller-supplied URL
    would be an SSRF primitive against the private network this service runs in.
    Send base64 image data instead.
  contact:
    name: Platform team
    url: https://example.internal/food-scanner

servers:
  - url: https://food-scanner.internal
    description: Private ingress (Render private service, internal load balancer, or single-VM nginx)
  - url: http://127.0.0.1:3001
    description: Local development

tags:
  - name: analysis
    description: Image analysis
  - name: nutrition
    description: Nutrition database lookups
  - name: ops
    description: Health and diagnostics

security:
  - InternalApiKey: []

paths:
  /livez:
    get:
      tags: [ops]
      summary: Liveness probe
      description: |
        Returns 200 whenever the process is running. Intended for load balancer
        and container health checks, which have no service token.

        Deliberately reveals nothing beyond liveness: no model identifier, no
        upstream configuration state, no version.
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok

  /readyz:
    get:
      tags: [ops]
      summary: Readiness probe
      description: |
        Returns 200 when both upstream providers are configured, 503 otherwise.
        Reports only *whether* credentials exist, never their values.

        Unauthenticated by design so orchestrators can use it. It is behind
        nginx, so it is not internet-reachable.
      security: []
      responses:
        "200":
          description: Both upstreams configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
                upstream:
                  vision: true
                  nutrition: true
        "503":
          description: At least one upstream is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: degraded
                upstream:
                  vision: true
                  nutrition: false

  /v1/health:
    get:
      tags: [ops]
      summary: Detailed service health
      description: Operational detail for the calling backend. Requires the shared secret.
      security:
        - InternalApiKey: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ready
                service_id: main-backend
                version: "2.0.0"
                vision:
                  model: gemini-3.5-flash
                  configured: true
                nutrition:
                  configured: true
                limits:
                  max_image_bytes: 4194304
                  request_timeout_ms: 20000
                  max_detected_items: 12
                uptime_s: 812
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/analyze:
    post:
      tags: [analysis]
      summary: Detect foods and estimate nutrition
      description: |
        Detects every food item in an image, estimates an edible weight for each,
        and scales USDA per-100g nutrition figures to that weight.

        Processing performs one vision-model call followed by up to two nutrition
        lookups per detected item, run with bounded concurrency.

        ### Partial results
        A food with no nutrition match is returned with `found: false`, zeroed
        macros, and its name listed in `unmatched`. This is a success, not an
        error.

        If a nutrition lookup *fails* while vision succeeded, the request still
        returns 200 with `degraded: true` and the affected item marked
        `found: false`. The caller can surface partial results rather than
        discarding a successful analysis.

        ### Limits
        `image` is capped at `MAX_IMAGE_BYTES` after base64 decoding (4 MiB by
        default) and the JSON body at roughly 4/3 of that. At most
        `MAX_DETECTED_ITEMS` items (12 by default) are returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
            examples:
              pngBase64:
                summary: Base64 PNG
                value:
                  image: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
                  mimeType: image/png
              withDataUrlPrefix:
                summary: Data URL prefix is accepted and stripped
                value:
                  image: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB"
      responses:
        "200":
          description: |
            Analysis completed. May be partial — check `degraded` and `unmatched`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
              examples:
                fullMatch:
                  summary: Every item matched a nutrition record
                  value:
                    request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f
                    model: gemini-3.5-flash
                    items:
                      - food_name: chicken breast
                        est_weight_g: 150
                        confidence: 0.92
                        found: true
                        fdc_id: 171477
                        description: Chicken breast, raw
                        kcal: 180
                        protein_g: 33.8
                        carbs_g: 0
                        fat_g: 3.9
                        per_100g:
                          kcal: 120
                          protein_g: 22.5
                          carbs_g: 0
                          fat_g: 2.6
                    unmatched: []
                    totals:
                      kcal: 180
                      protein_g: 33.8
                      carbs_g: 0
                      fat_g: 3.9
                    degraded: false
                partial:
                  summary: One nutrition lookup failed
                  value:
                    request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f
                    model: gemini-3.5-flash
                    items:
                      - food_name: chicken breast
                        est_weight_g: 150
                        confidence: 0.92
                        found: false
                        kcal: 0
                        protein_g: 0
                        carbs_g: 0
                        fat_g: 0
                    unmatched: [chicken breast]
                    totals:
                      kcal: 0
                      protein_g: 0
                      carbs_g: 0
                      fat_g: 0
                    degraded: true
                noFood:
                  summary: Valid image, nothing recognisable
                  value:
                    request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f
                    model: gemini-3.5-flash
                    items: []
                    unmatched: []
                    totals:
                      kcal: 0
                      protein_g: 0
                      carbs_g: 0
                      fat_g: 0
                    degraded: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/foods/search:
    get:
      tags: [nutrition]
      summary: Search the nutrition database
      description: |
        Searches USDA FoodData Central for foods matching a term. Results are
        ranked so that Foundation and SR Legacy records outrank branded ones.

        The term is trimmed, must be non-empty, and is capped at
        `MAX_SEARCH_QUERY_LENGTH` characters (120 by default).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
          example: chicken breast
      responses:
        "200":
          description: Matching foods
          content:
            application/json:
              schema:
                type: object
                required: [request_id, candidates]
                properties:
                  request_id:
                    type: string
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/FoodCandidate"
              example:
                request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f
                candidates:
                  - fdc_id: 171477
                    description: Chicken breast, raw
                    data_type: Foundation
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /v1/foods/{fdcId}:
    get:
      tags: [nutrition]
      summary: Nutrition detail for one food
      description: |
        Returns per-100g macronutrients for a USDA FoodData Central identifier.
        Results are cached in-process for one hour.
      parameters:
        - name: fdcId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 171477
      responses:
        "200":
          description: Nutrition detail
          content:
            application/json:
              schema:
                type: object
                required: [request_id, fdc_id, description, data_type, per_100g]
                properties:
                  request_id:
                    type: string
                  fdc_id:
                    type: integer
                  description:
                    type: string
                  data_type:
                    type: string
                  per_100g:
                    $ref: "#/components/schemas/Macros"
              example:
                request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f
                fdc_id: 171477
                description: Chicken breast, raw
                data_type: Foundation
                per_100g:
                  kcal: 120
                  protein_g: 22.5
                  carbs_g: 0
                  fat_g: 2.6
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/Timeout"

components:
  securitySchemes:
    InternalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: |
        Shared secret held by the main backend.

        Generate with:
        `node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"`

        Compared in constant time against the configured set. The service refuses
        to start if the secret is missing, under 32 characters, or a known
        placeholder value. Rotate by setting the new value alongside
        `SERVICE_TOKENS_PREVIOUS`, then clearing the old one.

  schemas:
    AnalyzeRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
          minLength: 1
          description: |
            Base64-encoded image. A `data:<mime>;base64,` prefix is accepted and
            stripped.

            The declared format is **not trusted**: the service sniffs the actual
            bytes and rejects anything that is not JPEG, PNG, or WebP with 415.
            Image URLs are not accepted, to avoid SSRF against the internal network.
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: |
            Advisory only. Present for the caller's convenience; the detected type
            from the image bytes always wins.

    Macros:
      type: object
      required: [kcal, protein_g, carbs_g, fat_g]
      properties:
        kcal:
          type: number
          description: Kilocalories.
        protein_g:
          type: number
          description: Protein in grams.
        carbs_g:
          type: number
          description: Carbohydrate in grams.
        fat_g:
          type: number
          description: Fat in grams.
      additionalProperties: false

    AnalyzedItem:
      type: object
      required: [food_name, est_weight_g, confidence, found, kcal, protein_g, carbs_g, fat_g]
      properties:
        food_name:
          type: string
        est_weight_g:
          type: number
          description: Estimated edible weight in grams, from the vision model.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Model confidence in the identification.
        found:
          type: boolean
          description: Whether a nutrition record was matched.
        fdc_id:
          type: integer
          description: USDA FoodData Central identifier. Absent when `found` is false.
        description:
          type: string
          description: Canonical name from the nutrition database.
        kcal:
          type: number
        protein_g:
          type: number
        carbs_g:
          type: number
        fat_g:
          type: number
        per_100g:
          $ref: "#/components/schemas/Macros"
      additionalProperties: false

    AnalyzeResponse:
      type: object
      required: [request_id, model, items, unmatched, totals, degraded]
      properties:
        request_id:
          type: string
          description: |
            Correlation id. Echoed from an inbound `X-Request-Id` when that value
            is well-formed, otherwise generated. Also returned in the
            `X-Request-Id` response header.
        model:
          type: string
          description: Vision model that produced the detection.
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnalyzedItem"
        unmatched:
          type: array
          items:
            type: string
          description: Names of detected foods with no nutrition match.
        totals:
          $ref: "#/components/schemas/Macros"
        degraded:
          type: boolean
          description: |
            True when at least one nutrition lookup failed. The item list is
            still complete; only the nutrition figures are partial.
      additionalProperties: false

    FoodCandidate:
      type: object
      required: [fdc_id, description, data_type]
      properties:
        fdc_id:
          type: integer
        description:
          type: string
        data_type:
          type: string
          description: USDA record type, for example `Foundation` or `Branded`.
      additionalProperties: false

    Readiness:
      type: object
      required: [status, upstream]
      properties:
        status:
          type: string
          enum: [ready, degraded]
        upstream:
          type: object
          required: [vision, nutrition]
          properties:
            vision:
              type: boolean
              description: Whether a vision API key is configured. Never the key itself.
            nutrition:
              type: boolean
      additionalProperties: false

    Health:
      type: object
      required: [status, service_id, version, vision, nutrition, limits, uptime_s]
      properties:
        status:
          type: string
          enum: [ready, degraded]
        service_id:
          type: string
        version:
          type: string
        vision:
          type: object
          required: [model, configured]
          properties:
            model:
              type: string
            configured:
              type: boolean
        nutrition:
          type: object
          required: [configured]
          properties:
            configured:
              type: boolean
        limits:
          type: object
          required: [max_image_bytes, request_timeout_ms, max_detected_items]
          properties:
            max_image_bytes:
              type: integer
            request_timeout_ms:
              type: integer
            max_detected_items:
              type: integer
        uptime_s:
          type: integer
      additionalProperties: false

    Error:
      type: object
      description: |
        The single error shape returned by every failing endpoint. `message` is
        safe to log; it never contains upstream provider text, credentials, or
        internal hostnames.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - UNAUTHENTICATED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - RATE_LIMITED
                - INTERNAL
                - UPSTREAM_UNAVAILABLE
                - UPSTREAM_TIMEOUT
                - TIMEOUT
                - SERVICE_UNAVAILABLE
              description: Stable machine-readable code. Branch on this, not on `message`.
            message:
              type: string
            request_id:
              type: string
              description: Same value as the `X-Request-Id` response header.
            details:
              description: |
                Optional structured context. For `INVALID_REQUEST` this carries a
                `issues` array of `{ path, code, message }` per offending field.
      additionalProperties: false

  responses:
    BadRequest:
      description: |
        Malformed request: failed schema validation, unparseable JSON, or an
        empty/oversized `q`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INVALID_REQUEST
              message: Request failed validation
              request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f
              details:
                issues:
                  - path: image
                    code: invalid_type
                    message: image is required

    Unauthorized:
      description: |
        The `X-Internal-Api-Key` header was missing or did not match. The service
        compares in constant time and returns the same response either way, so an
        attacker cannot distinguish an unknown token from a malformed one.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: ApiKey realm="food-scanner", header="X-Internal-Api-Key"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHENTICATED
              message: Missing or invalid credentials
              request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f

    NotFound:
      description: No such route, or no nutrition record for that identifier.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: No route for GET /v1/nope
              request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f

    PayloadTooLarge:
      description: The request body exceeded the configured limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: image exceeds the 4194304 byte limit
              request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f
              details:
                max_image_bytes: 4194304

    UnsupportedMediaType:
      description: |
        The `Content-Type` was not `application/json`, or the image bytes were not
        a recognisable JPEG, PNG, or WebP.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: image bytes do not match a supported image format (jpeg, png, webp)
              request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f

    RateLimited:
      description: The calling service exceeded its request budget.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RATE_LIMITED
              message: Caller exceeded the request rate limit
              request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f
              details:
                retry_after_s: 42

    InternalError:
      description: |
        An unexpected failure. The response is deliberately generic; the detail is
        in the service logs, correlated by `request_id`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL
              message: Internal server error
              request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f

    UpstreamUnavailable:
      description: The vision or nutrition provider returned an error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UPSTREAM_UNAVAILABLE
              message: nutrition database is currently unavailable
              request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f
              details:
                upstream: nutrition database

    ServiceUnavailable:
      description: |
        The service is up but cannot serve this request, for example because a
        provider credential is not configured on this instance.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Vision model is not configured on this service
              request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f
              details:
                missing_env: GEMINI_API_KEY

    Timeout:
      description: |
        The request exceeded the total time budget (`REQUEST_TIMEOUT_MS`), or an
        upstream call exceeded `UPSTREAM_TIMEOUT_MS`. Retrying is safe: no partial
        state is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UPSTREAM_TIMEOUT
              message: vision model did not respond in time
              request_id: 3f1c9a2e-5b7d-4c8a-9e1f-2a6b3c4d5e6f
              details:
                upstream: vision model
