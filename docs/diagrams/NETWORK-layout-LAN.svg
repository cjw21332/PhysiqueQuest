<text x="40" y="1045" font-family="Arial, sans-serif" font-size="16" fill="#15314b">Solid arrows: request/data paths. Dashed arrows: development-only or feature/configuration-dependent paths.</text>
<text x="40" y="1075" font-family="Arial, sans-serif" font-size="16" fill="#15314b">The router is a network path, not an API proxy. GIF requests execute on the client after metadata is returned.</text></svg>