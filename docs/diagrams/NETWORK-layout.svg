<text x="40" y="1140" font-family="Arial, sans-serif" font-size="16" fill="#15314b">Solid arrows: runtime request paths. Dashed arrows: installation or feature-dependent paths. All public app requests use HTTPS.</text>
<text x="40" y="1175" font-family="Arial, sans-serif" font-size="16" fill="#15314b">The release app needs no Expo Go or Metro server. The existing WebView design still requires the hosted frontend and APIs.</text></svg>