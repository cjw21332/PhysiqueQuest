<text x="48" y="48" font-size="30" fill="#15314b">PhysiqueQuest / Embedded data</text>
<text x="48" y="82" font-size="16" fill="#52657a">Solid lines mean containment  |  Child boxes live inside parent documents; they are not separate collections</text>
<text x="48" y="1220" font-size="17" fill="#52657a">SetResult.exerciseId matches an exercise snapshot within the same workout; string IDs are not catalog foreign keys.</text>
<text x="48" y="1190" font-size="17" fill="#52657a">sourceRecordingId links an imported planned set to its original reviewed recording; no source video is stored.</text>
<text x="48" y="1250" font-size="17" fill="#52657a">WorkoutExercise and SetResult are generic object arrays shaped by the workout contract. Other child objects have embedded schemas.</text>
<text x="48" y="1280" font-size="17" fill="#52657a">No independent MongoDB _id on the child objects. ? marks optional or nullable fields. PK / UK constraints belong to parent collections.</text>
